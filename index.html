<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Astrolabe</title>

    <!-- KaTeX CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
      integrity="sha384-nB0miv6/jRmo5LUSBER0GsLZsUQ5Y40yVsFkDCL1WANkFN0HBpg1A+OI/O0ksCi6"
      crossorigin="anonymous"
    />

    <!-- Prevent flash of unstyled content -->
    <script>
      (function () {
        const theme = localStorage.getItem("astrolabe-theme");
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body class="bg-warm-50 text-warm-900 dark:bg-warm-950 dark:text-warm-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
